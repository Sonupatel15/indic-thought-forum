name: Preview deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  preview:
    name: Build and upload preview

    # Secrets are not available to PRs from forks.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}

    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_FORMS_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORMS_ENDPOINT }}
      NEXT_PUBLIC_DONATION_URL: ${{ vars.NEXT_PUBLIC_DONATION_URL }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint application code
        run: npx eslint src tests scripts *.ts *.mjs --max-warnings=0 --no-warn-ignored

      - name: Build Worker
        run: npm run build:cloudflare

      - name: Upload preview version
        id: upload
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PREVIEW_ALIAS: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}

        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA:0:7}"
          MESSAGE="${GITHUB_REF_NAME} @ ${SHORT_SHA}"

          args=(
            "--tag=${SHORT_SHA}"
            "--message=${MESSAGE}"
          )

          if [ -n "$PREVIEW_ALIAS" ]; then
            args+=("--preview-alias=${PREVIEW_ALIAS}")
          fi

          npx opennextjs-cloudflare upload "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/upload.log"

          # Get the preview URL from Wrangler output.
          url=$(
            jq -r '
              select(.type=="version-upload")
              | .preview_alias_url // .preview_url // empty
            ' "$WRANGLER_OUTPUT_FILE_PATH" 2>/dev/null | tail -n1
          )

          # Fallback: extract workers.dev URL from upload logs.
          if [ -z "$url" ]; then
            url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/upload.log" | tail -n1 || true)
          fi

          if [ -z "$url" ]; then
            echo "::error::Could not find a preview URL. Ensure workers.dev and Preview URLs are enabled for the Worker."
            exit 1
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}

        with:
          script: |
            const marker = '<!-- cloudflare-preview -->';

            const body = `${marker}
            **Preview deployed** for ${context.payload.pull_request.head.sha.slice(0, 7)}

            ${process.env.PREVIEW_URL}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );

            const existing = comments.find((c) =>
              c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
