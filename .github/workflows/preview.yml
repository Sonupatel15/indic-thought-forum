name: Cloudflare Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and upload preview
    runs-on: ubuntu-latest

    # Skip fork PRs because repository secrets are not available to them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint src tests scripts *.ts *.mjs --max-warnings=0 --no-warn-ignored

      - name: Build for Cloudflare
        run: npm run build:cloudflare
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_FORMS_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORMS_ENDPOINT }}
          NEXT_PUBLIC_DONATION_URL: ${{ vars.NEXT_PUBLIC_DONATION_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload Cloudflare preview
        id: upload
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_FORMS_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORMS_ENDPOINT }}
          NEXT_PUBLIC_DONATION_URL: ${{ vars.NEXT_PUBLIC_DONATION_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          NEXT_TELEMETRY_DISABLED: 1
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          if [ -n "$PR_NUMBER" ]; then
            PREVIEW_ALIAS="pr-${PR_NUMBER}"
          else
            PREVIEW_ALIAS="manual-${GITHUB_RUN_ID}"
          fi

          echo "Uploading preview with alias: ${PREVIEW_ALIAS}"

          npx opennextjs-cloudflare upload \
            "--preview-alias=${PREVIEW_ALIAS}" \
            2>&1 | tee "$RUNNER_TEMP/upload.log"

          # Read the preview URL from Wrangler's NDJSON output.
          url=$(
            jq -r '
              select(.type=="version-upload")
              | .preview_alias_url // .preview_url // empty
            ' "$WRANGLER_OUTPUT_FILE_PATH" 2>/dev/null | tail -n1 || true
          )

          # Fallback: find a workers.dev URL in the upload logs.
          if [ -z "$url" ]; then
            url=$(
              grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' \
                "$RUNNER_TEMP/upload.log" | tail -n1 || true
            )
          fi

          if [ -z "$url" ]; then
            echo "::error::Could not find a preview URL. Check workers.dev and Preview URLs settings for the Worker."
            exit 1
          fi

          echo "Preview URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Cloudflare Preview\n\n${url}\n\nThis preview was generated from commit \`${context.sha.substring(0, 7)}\`.`
            });
